name: "setup-octoscript"
description: |
  Install octoscript as a shell command. After this step, any `run:`
  block with `shell: octoscript {0}` executes as a Deno+Octokit script
  with injected globals: github, context, core, git, Mustache, template,
  inputs, shared, output, and more.

inputs:
  deno-version:
    description: "Deno version to install."
    required: false
    default: "v2.x"

runs:
  using: composite
  steps:
    - uses: denoland/setup-deno@v2
      with:
        deno-version: ${{ inputs.deno-version }}

    - shell: bash
      run: |
        deno install --global --allow-all --name octoscript \
          "https://raw.githubusercontent.com/sw2m/octoscript/main/runner.ts"
        echo "✓ octoscript installed → $(which octoscript)"
