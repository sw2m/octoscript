name: "setup-octoscript"
description: "Install octoscript if not already present. Idempotent."
inputs:
  deno-version:
    required: false
    default: "v2.x"
runs:
  using: composite
  steps:
    - if: ${{ !hashFiles('/usr/local/bin/octoscript') && !hashFiles('/home/runner/.deno/bin/octoscript') }}
      uses: denoland/setup-deno@v2
      with:
        deno-version: ${{ inputs.deno-version }}

    - shell: bash
      run: |
        if command -v octoscript &>/dev/null; then
          echo "✓ octoscript already installed → $(which octoscript)"
          exit 0
        fi
        if ! command -v deno &>/dev/null; then
          echo "::error::deno not found — setup-deno must run first"
          exit 1
        fi
        deno install --global --allow-all --name octoscript \
          "https://raw.githubusercontent.com/sw2m/octoscript/main/runner.ts"
        echo "✓ octoscript installed → $(which octoscript)"
