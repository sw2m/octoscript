name: "setup-octoscript"
description: "Install octoscript and export required env vars for downstream steps."
inputs:
  deno-version:
    required: false
    default: "v2.x"
  github-token:
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - if: ${{ !hashFiles('/usr/local/bin/octoscript') && !hashFiles('/home/runner/.deno/bin/octoscript') }}
      uses: denoland/setup-deno@v2
      with:
        deno-version: ${{ inputs.deno-version }}

    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        if command -v octoscript &>/dev/null; then
          echo "✓ octoscript already installed → $(which octoscript)"
        else
          if ! command -v deno &>/dev/null; then
            echo "::error::deno not found — setup-deno must run first"
            exit 1
          fi
          deno install --global --allow-all --reload --name octoscript \
            "https://raw.githubusercontent.com/sw2m/octoscript/main/runner.ts"
          echo "✓ octoscript installed → $(which octoscript)"
        fi
        echo "::add-mask::$GITHUB_TOKEN"
        echo "GITHUB_TOKEN=$GITHUB_TOKEN" >> "$GITHUB_ENV"
        # Forward runner-internal vars needed by @actions/artifact
        for v in ACTIONS_RUNTIME_TOKEN ACTIONS_RUNTIME_URL ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
          val="${!v}"
          if [ -n "$val" ]; then
            echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          fi
        done
        # Create a wrapper that copies scripts to GITHUB_WORKSPACE before
        # running octoscript, so relative imports resolve against the checkout.
        REAL_OCTOSCRIPT=$(which octoscript)
        cat > /tmp/octoscript-wrapper << WRAPPER
        #!/bin/bash
        SCRIPT="\$1"
        WS="\${GITHUB_WORKSPACE:-.}"
        COPY="\$WS/.octoscript-\$\$.ts"
        cp "\$SCRIPT" "\$COPY"
        "\$REAL_OCTOSCRIPT" "\$COPY"
        RC=\$?
        rm -f "\$COPY"
        exit \$RC
        WRAPPER
        chmod +x /tmp/octoscript-wrapper
        # Replace octoscript on PATH with the wrapper
        INSTALL_DIR=$(dirname "$REAL_OCTOSCRIPT")
        mv "$REAL_OCTOSCRIPT" "$INSTALL_DIR/octoscript-real"
        cp /tmp/octoscript-wrapper "$INSTALL_DIR/octoscript"
        chmod +x "$INSTALL_DIR/octoscript"
